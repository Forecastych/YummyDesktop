[package]
name = "yummi-desktop"
version = "0.3.5"
description = "Unofficial desktop client for YummyAnime"
authors = ["YummyDesktop contributors"]
license = "UNLICENSED"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "yummi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Кэш картинок (imgcache.rs). TLS — тот же rustls+ring, что уже тянет updater,
# чтобы не собирать второй крипто-бэкенд.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync", "time"] }

# Небольшой и быстрый релизный бинарник.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true
